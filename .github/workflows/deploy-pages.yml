name: Deploy Chess Royale to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code style
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check types and build the site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the production site
        env:
          PLAYWRIGHT_PREVIEW_URL: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}/
        run: npm run test:e2e -- --project desktop --grep @pages
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
